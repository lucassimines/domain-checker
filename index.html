<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domain Availability Viewer</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#172033;background:#f6f8fb}*{box-sizing:border-box}body{margin:0;padding:32px 20px}.wrap{max-width:1050px;margin:auto}h1{font-size:28px;letter-spacing:-.8px;margin:0 0 6px}p{color:#667085;margin:0 0 22px}.toolbar,.stats,.panel{background:white;border:1px solid #e3e8ef;border-radius:12px}.toolbar{padding:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}button,input,.upload{font:inherit;border:1px solid #d5dce6;border-radius:8px;padding:10px 12px;background:white;color:inherit}button{cursor:pointer}button.active{background:#175cd3;color:white;border-color:#175cd3}input[type=search]{flex:1;min-width:180px}.upload{cursor:pointer;display:inline-block}.upload input{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:14px}.stat{padding:16px;border-right:1px solid #e3e8ef}.stat:last-child{border:0}.stat strong{display:block;font-size:26px}.stat small{color:#667085}.panel{overflow:hidden}.tablewrap{overflow:auto;max-height:65vh}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:12px 18px;border-bottom:1px solid #edf0f5}th{position:sticky;top:0;background:#f9fafb;font-size:12px;color:#667085;text-transform:uppercase;letter-spacing:.04em}td{font-size:14px}td:first-child{font-weight:600}a{color:#175cd3;text-decoration:none}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#f2f4f7;font-size:12px;font-weight:700}.AVAILABLE{background:#dcfae6;color:#067647}.REGISTERED{background:#f2f4f7;color:#475467}.UNKNOWN,.ERROR{background:#fef0c7;color:#92400e}.foot{padding:14px 18px;color:#667085;font-size:13px}.empty{text-align:center;padding:50px 15px;color:#667085}@media(max-width:600px){body{padding:18px 10px}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid #e3e8ef}th,td{padding:10px}}
</style>
</head>
<body><main class="wrap">
<h1>Domain Availability</h1><p>Explore your Registro.br domain checks. Availability is preliminary; verify before registering.</p>
<section class="stats" id="stats"></section>
<section class="toolbar"><input type="search" id="search" placeholder="Search domains…" aria-label="Search domains"><select id="filter" aria-label="Filter status" style="padding:10px;border:1px solid #d5dce6;border-radius:8px"><option value="ALL">All statuses</option><option>AVAILABLE</option><option>REGISTERED</option><option>UNKNOWN</option><option>ERROR</option></select><label class="upload">Upload CSV<input id="file" type="file" accept=".csv,text/csv"></label><button id="reload">Reload</button></section>
<section class="panel"><div class="tablewrap"><table><thead><tr><th>Domain</th><th>Status</th><th>Code</th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot" id="foot">Loading…</div></section>
</main><script>
const $=id=>document.getElementById(id);let data=[];const order={AVAILABLE:0,REGISTERED:1,UNKNOWN:2,ERROR:3};
function parseCSV(text){const lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);const headers=lines.shift()?.split(',').map(x=>x.trim().toLowerCase())||[];return lines.filter(Boolean).map(line=>{const cols=line.split(',');return Object.fromEntries(headers.map((h,i)=>[h,(cols[i]||'').trim()]))}).filter(x=>x.domain)}
function render(){const counts={AVAILABLE:0,REGISTERED:0,UNKNOWN:0,ERROR:0};data.forEach(x=>{if(x.status in counts)counts[x.status]++});$('stats').replaceChildren(...[['Total',data.length],['Available',counts.AVAILABLE],['Registered',counts.REGISTERED],['Other',counts.UNKNOWN+counts.ERROR]].map(([label,n])=>{const el=document.createElement('div');el.className='stat';const strong=document.createElement('strong');strong.textContent=n.toLocaleString();const small=document.createElement('small');small.textContent=label;el.append(strong,small);return el}));const query=$('search').value.trim().toLowerCase(),status=$('filter').value;const filtered=data.filter(x=>x.domain.toLowerCase().includes(query)&&(status==='ALL'||x.status===status));const tbody=$('rows');tbody.replaceChildren();for(const x of filtered){const tr=document.createElement('tr');const domain=document.createElement('td');domain.textContent=x.domain;const stat=document.createElement('td');const pill=document.createElement('span');pill.className='pill '+(x.status in order?x.status:'UNKNOWN');pill.textContent=x.status||'UNKNOWN';stat.append(pill);const code=document.createElement('td');code.textContent=x.code??'';tr.append(domain,stat,code);tbody.append(tr)}if(!filtered.length){const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=3;td.className='empty';td.textContent=data.length?'No matching domains.':'No data loaded. Upload domain-results.csv or run a local server.';tr.append(td);tbody.append(tr)}$('foot').textContent=`Showing ${filtered.length.toLocaleString()} of ${data.length.toLocaleString()} domains`}
function setData(text){data=parseCSV(text).sort((a,b)=>(order[a.status]??99)-(order[b.status]??99)||a.domain.localeCompare(b.domain));render()}
async function load(){try{const res=await fetch('domain-results.csv',{cache:'no-store'});if(!res.ok)throw Error('CSV not found');setData(await res.text())}catch{if(!data.length)render();$('foot').textContent='Could not auto-load domain-results.csv. Upload it above, or serve this folder locally.'}}
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('reload').addEventListener('click',load);$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(f)setData(await f.text())});load();
</script></body></html>
